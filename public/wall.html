<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Muro en Vivo - EventSnap</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="./css/main.css">
    <style>
        /* Wall Specific Styles */
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            /* No scroll */
            background-color: #000;
            cursor: none;
            /* Hide cursor by default */
        }

        /* Show cursor if moving (handled by JS if possible, or CSS hover trick) */
        body.show-cursor {
            cursor: default;
        }

        .wall-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .photo-frame {
            position: relative;
            max-width: 90vw;
            max-height: 85vh;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 20px;
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            opacity: 0;
            transform: scale(0.9);

            /* CSS Grid for Stacking */
            display: grid;
            grid-template-areas: "stack";
            width: fit-content;
            height: fit-content;
        }

        .photo-frame.active {
            opacity: 1;
            transform: scale(1);
        }

        /* Breaking News Animation */
        .photo-frame.breaking {
            animation: popIn 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            border: 4px solid #fff;
            box-shadow: 0 0 50px rgba(255, 255, 255, 0.6);
        }

        @keyframes popIn {
            0% {
                transform: scale(0.5);
                opacity: 0;
            }

            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        .main-image {
            grid-area: stack;
            /* Stack both images in same cell */
            width: 100%;
            height: auto;
            /* Let image define height */
            max-height: 75vh;
            object-fit: contain;
            border-radius: 12px;
            display: block;
            transition: opacity 1s ease-in-out;
            opacity: 0;
        }

        .main-image.active {
            opacity: 1;
        }

        .uploader-badge {
            position: absolute;
            bottom: -60px;
            /* Outside right below image, or inside */
            right: 30px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 10px 20px;
            border-radius: 50px;
            font-size: 1.5rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .qr-corner {
            position: absolute;
            bottom: 30px;
            left: 30px;
            background: white;
            padding: 10px;
            border-radius: 10px;
            text-align: center;
        }

        .qr-corner img {
            width: 120px;
            height: 120px;
            display: block;
        }

        .qr-text {
            color: #000;
            font-weight: bold;
            margin-top: 5px;
            font-size: 1rem;
        }

        .empty-state {
            color: white;
            text-align: center;
            font-size: 2rem;
            opacity: 0.7;
        }

        .wall-controls {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 8px;
            align-items: center;
            background: rgba(15, 23, 42, 0.65);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 999px;
            padding: 8px 10px;
            backdrop-filter: blur(8px);
        }

        .wall-control-btn {
            border: none;
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
            padding: 8px 12px;
            border-radius: 999px;
            cursor: pointer;
            font-size: 0.9rem;
        }

        .wall-control-btn:hover {
            background: rgba(255, 255, 255, 0.25);
        }

        .wall-status {
            color: #fff;
            font-size: 0.85rem;
            padding: 0 4px;
            white-space: nowrap;
        }

        @media (max-width: 768px) {
            .wall-controls {
                top: 10px;
                right: 10px;
                left: 10px;
                border-radius: 12px;
                justify-content: space-between;
            }

            .wall-status {
                font-size: 0.75rem;
            }
        }
    </style>
</head>

<body>

    <div id="wallContainer" class="wall-container">

        <!-- Loading -->
        <div id="loadingMsg" class="empty-state">
            Conectando al evento...
        </div>

        <!-- Main Photo Frame -->
        <div id="photoFrame" class="photo-frame hidden">
            <!-- Double Buffer for smooth transitions -->
            <img id="wallImage1" class="main-image active" src="" alt="Momentazo">
            <img id="wallImage2" class="main-image" src="" alt="Momentazo">
            <video id="wallVideo" class="main-image hidden" playsinline muted preload="metadata"></video>

            <div id="uploaderBadge" class="uploader-badge">
                <span style="font-size:1.2em">📸</span> <span id="uploaderName">Usuario</span>
            </div>
        </div>

        <!-- QR Corner -->
        <div class="qr-corner">
            <img id="qrCode" src="" alt="Únete">
            <div class="qr-text">¡Sube tu foto!</div>
        </div>

        <div class="wall-controls" aria-label="Controles del muro">
            <button id="togglePlaybackBtn" class="wall-control-btn" type="button">⏸️ Pausar</button>
            <button id="nextPhotoBtn" class="wall-control-btn" type="button">⏭️ Siguiente</button>
            <button id="fullscreenBtn" class="wall-control-btn" type="button">🖥️ Fullscreen</button>
            <span id="wallStatus" class="wall-status">Esperando fotos...</span>
        </div>

    </div>

    <script type="module" src="./js/firebase-config.js"></script>
    <script type="module" src="./js/wall.js"></script>
</body>

</html>
