<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>EventSnap Projector</title>
    <style>
        :root {
            /* Tokens from Admin.html / index.html */
            --bg1: #fff1f7;
            --bg2: #f3f0ff;
            --bg3: #e9fbff;
            --card: rgba(255, 255, 255, 0.85);
            --ink: #0f172a;
            --accent1: #ff4d8d;
            --accent2: #7c3aed;
            --accent3: #06b6d4;
            --shadow: 0 18px 55px rgba(2, 6, 23, .12);
        }

        html,
        body {
            height: 100%;
            margin: 0;
            /* Dark backdrop for projector but with branding vibes */
            background: #000;
            overflow: hidden;
            font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
            color: white;
        }

        /* Subtle branded ambient light behind projector */
        body::before {
            content: '';
            position: fixed;
            top: 50%;
            left: 50%;
            width: 150vw;
            height: 150vw;
            transform: translate(-50%, -50%);
            background: radial-gradient(circle at 50% 50%, rgba(124, 58, 237, 0.15), rgba(255, 77, 141, 0.1), transparent 60%);
            pointer-events: none;
            z-index: 0;
        }

        .wrap {
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            z-index: 1;
            padding: 20px;
            /* Space for border */
            box-sizing: border-box;
        }

        .img-container {
            position: relative;
            max-width: 100%;
            max-height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 20px;
            /* Neon Gradient Border Container */
            padding: 4px;
            background: linear-gradient(45deg, var(--accent1), var(--accent2), var(--accent3), var(--accent1));
            background-size: 300% 300%;
            animation: gradientBorder 6s ease infinite;
            box-shadow: 0 0 50px rgba(124, 58, 237, 0.3);
        }

        @keyframes gradientBorder {
            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }

        /* Black inner for image */
        .img-inner {
            background: #000;
            border-radius: 18px;
            overflow: hidden;
            position: relative;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        img {
            max-width: calc(100vw - 50px);
            max-height: calc(100vh - 50px);
            /* Ajuste para el borde */
            object-fit: contain;
            transition: opacity .8s cubic-bezier(0.4, 0, 0.2, 1);
            opacity: 0;
            display: block;
        }

        /* HUD: Glass Floating Bar */
        .hud {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: var(--ink);
            background: var(--card);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 10px 24px;
            border-radius: 100px;
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            z-index: 10;
            display: flex;
            align-items: center;
            gap: 12px;
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            font-weight: 500;
        }

        .hud:hover,
        body:hover .hud {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .btn {
            cursor: pointer;
            user-select: none;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: rgba(15, 23, 42, 0.05);
            transition: all 0.2s;
            font-size: 18px;
        }

        .btn:hover {
            background: var(--ink);
            color: white;
            transform: scale(1.1);
        }

        /* Config Overlay: Clean White Glass */
        .config-overlay {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 101;
            transition: opacity 0.3s;
        }

        .config-box {
            background: rgba(255, 255, 255, 0.95);
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 420px;
            width: 90%;
            color: var(--ink);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        .config-box h2 {
            background: linear-gradient(135deg, var(--accent1), var(--accent2));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin: 0 0 10px 0;
            font-size: 28px;
        }

        .config-box input {
            width: 100%;
            padding: 14px;
            margin: 10px 0;
            background: #f8fafc;
            border: 2px solid #e2e8f0;
            color: var(--ink);
            border-radius: 12px;
            font-size: 14px;
            outline: none;
            transition: border 0.2s;
            box-sizing: border-box;
        }

        .config-box input:focus {
            border-color: var(--accent2);
            background: white;
        }

        .config-box button {
            background: var(--ink);
            color: white;
            border: none;
            padding: 16px;
            border-radius: 14px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            margin-top: 16px;
            width: 100%;
            transition: transform 0.2s, background 0.2s;
        }

        .config-box button:hover {
            background: var(--accent2);
            transform: translateY(-2px);
        }

        .hidden {
            display: none !important;
        }

        /* Watermark: Premium Neon */
        .watermark {
            position: fixed;
            bottom: 24px;
            right: 32px;
            color: white;
            padding: 8px 16px;
            border-radius: 100px;
            background: rgba(15, 23, 42, 0.4);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            z-index: 5;
            pointer-events: none;
            transition: opacity 0.3s;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
        }

        .watermark span {
            background: linear-gradient(90deg, var(--accent1), var(--accent2));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            font-weight: 800;
        }

        body:hover .watermark {
            opacity: 0.6;
        }
    </style>
</head>

<body>
    <!-- Config Overlay -->
    <div id="config" class="config-overlay">
        <div class="config-box">
            <h2>Configuración del Proyector</h2>
            <p style="font-size: 0.9em; color: #aaa; margin-bottom: 1rem;">Introduce la URL del Web App de Google Apps
                Script y el ID de la carpeta.</p>

            <input type="text" id="scriptUrl" placeholder="URL del Script (exec...)" />
            <input type="text" id="folderId" placeholder="ID de la Carpeta de Google Drive" />
            <input type="number" id="secTime" placeholder="Segundos por foto (def: 8)" value="8" />

            <button id="startBtn">Comenzar Proyección</button>
            <p id="errorMsg" style="color: #ff4444; margin-top: 10px; font-size: 0.9em;"></p>
        </div>
    </div>

    <div class="wrap">
        <div class="img-container">
            <div class="img-inner">
                <img id="slide" alt="slide" />
            </div>
        </div>
    </div>

    <div class="hud">
        <span id="status" style="font-size:13px; color:#555">Cargando…</span>
        <span class="btn" id="prev" title="Anterior">⟵</span>
        <span class="btn" id="next" title="Siguiente">⟶</span>
        <span class="btn" id="fs" title="Pantalla Completa">⛶</span>
        <span class="btn" id="configBtn" style="background:var(--ink); color:white" title="Configuración">⚙</span>
    </div>

    <!-- Watermark -->
    <div class="watermark">
        POWERED BY <span>EventSnap</span>
    </div>

    <script>
        // --- Estado Global ---
        let items = [];
        let curIdx = 0;
        let timer = null;
        let SEC = 8;
        let SCRIPT_URL = '';
        const cache = new Map();

        // --- Elementos ---
        const els = {
            config: document.getElementById('config'),
            scriptUrl: document.getElementById('scriptUrl'),
            folderId: document.getElementById('folderId'),
            secTime: document.getElementById('secTime'),
            startBtn: document.getElementById('startBtn'),
            errorMsg: document.getElementById('errorMsg'),
            slide: document.getElementById('slide'),
            status: document.getElementById('status'),
            next: document.getElementById('next'),
            prev: document.getElementById('prev'),
            fs: document.getElementById('fs'),
            configBtn: document.getElementById('configBtn'),
        };

        // --- Init ---
        // Prioridad: 1. URL Params, 2. LocalStorage, 3. User Input
        const params = new URLSearchParams(window.location.search);

        const urlParams = {
            url: params.get('scriptUrl'),
            folder: params.get('folderId'),
            sec: params.get('sec')
        };

        const savedUrl = localStorage.getItem('es_projector_url');
        const savedFolder = localStorage.getItem('es_projector_folder');

        // Valores iniciales en inputs
        els.scriptUrl.value = urlParams.url || savedUrl || '';
        els.folderId.value = urlParams.folder || savedFolder || '';
        if (urlParams.sec) els.secTime.value = urlParams.sec;

        // Auto-start si hay folder y (url o savedUrl)
        if (urlParams.folder && (urlParams.url || savedUrl)) {
            // Pequeño delay para asegurar carga DOM
            setTimeout(() => {
                els.startBtn.click();
            }, 100);
        }

        els.startBtn.onclick = async () => {
            const url = els.scriptUrl.value.trim();
            const folder = els.folderId.value.trim();
            const sec = parseInt(els.secTime.value) || 8;

            if (!url || !folder) {
                els.config.classList.remove('hidden'); // Asegurar visible si falla auto-start
                els.errorMsg.textContent = "Por favor completa ambos campos (Script URL y Folder ID).";
                return;
            }

            els.startBtn.disabled = true;
            els.startBtn.textContent = "Conectando...";
            els.errorMsg.textContent = "";

            SCRIPT_URL = url;
            SEC = sec;

            try {
                await loadImages(folder);

                // Guardar éxito (solo si no viene por URL puros para no ensuciar si es link temporal)
                if (!urlParams.folder) {
                    localStorage.setItem('es_projector_url', url);
                    localStorage.setItem('es_projector_folder', folder);
                }
                // Si viene URL pero no urlParam, guardamos la url base
                if (!urlParams.url) localStorage.setItem('es_projector_url', url);


                els.config.classList.add('hidden');
                startSlideshow();
            } catch (err) {
                els.config.classList.remove('hidden');
                els.errorMsg.textContent = "Error: " + err.message;
            } finally {
                els.startBtn.disabled = false;
                els.startBtn.textContent = "Comenzar Proyección";
            }
        };

        els.configBtn.onclick = () => {
            stop();
            els.config.classList.remove('hidden');
        };

        // --- Lógica del Proyector ---

        async function loadImages(folderId) {
            // Llamada API: ?action=list&folderId=...
            const resp = await fetch(`${SCRIPT_URL}?action=list&folderId=${folderId}`);
            const json = await resp.json();

            if (!json.success) throw new Error(json.error || 'Error desconocido del script');

            items = json.data || [];
            if (items.length === 0) throw new Error('La carpeta está vacía o no es accesible.');

            // Shuffle simple
            items.sort(() => Math.random() - 0.5);
        }

        async function getDataUrl(fileId) {
            if (cache.has(fileId)) return cache.get(fileId);

            // Llamada API: ?action=image&fileId=...
            // Nota: Fetch directo al script url con redirects
            const resp = await fetch(`${SCRIPT_URL}?action=image&fileId=${fileId}`);
            const json = await resp.json();

            if (!json.success) throw new Error(json.error);

            const dataUrl = json.data;
            cache.set(fileId, dataUrl);
            return dataUrl;
        }

        async function show(idx) {
            if (!items.length) return;

            // Loop circular
            curIdx = (idx + items.length) % items.length;

            // UI Update
            els.status.textContent = `Cargando foto ${curIdx + 1}/${items.length}...`;
            els.slide.style.opacity = 0;

            try {
                const fileId = items[curIdx].id;
                const dataUrl = await getDataUrl(fileId);

                els.slide.src = dataUrl;

                // Esperar a que cargue en el DOM para transición
                await new Promise((resolve) => {
                    els.slide.onload = () => {
                        els.slide.style.opacity = 1;
                        els.status.textContent = `Foto ${curIdx + 1}/${items.length} · ${SEC}s`;
                        resolve();
                    };
                });

                // Precarga siguiente (sin await)
                const nextId = items[(curIdx + 1) % items.length].id;
                if (!cache.has(nextId)) getDataUrl(nextId).catch(console.warn);

            } catch (err) {
                console.error(err);
                els.status.textContent = 'Error: ' + err.message;
                // Intentar siguiente tras 3s si falla
                setTimeout(() => show(curIdx + 1), 3000);
            }
        }

        async function startSlideshow() {
            // Esperar a que la primera imagen esté completamente cargada
            await show(0);
            // Solo entonces iniciar el timer automático
            startTimer();
        }

        function startTimer() {
            stop();
            timer = setInterval(() => show(curIdx + 1), SEC * 1000);
        }

        function stop() {
            if (timer) clearInterval(timer);
            timer = null;
        }

        // --- Controles ---
        els.next.onclick = () => { show(curIdx + 1); startTimer(); };
        els.prev.onclick = () => { show(curIdx - 1); startTimer(); };

        els.fs.onclick = async () => {
            if (!document.fullscreenElement) await document.documentElement.requestFullscreen();
            else await document.exitFullscreen();
        };

        // Teclado
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight') els.next.click();
            if (e.key === 'ArrowLeft') els.prev.click();
            if (e.key === 'Escape') els.configBtn.click();
        });

    </script>
</body>

</html>
