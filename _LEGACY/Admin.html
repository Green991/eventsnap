<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Admin - EventSnap</title>
  <style>
    :root {
      --bg1: #fff1f7;
      --bg2: #f3f0ff;
      --bg3: #e9fbff;
      --card: #ffffffcc;
      --ink: #0f172a;
      --muted: #334155;
      --shadow: 0 18px 55px rgba(2, 6, 23, .12);
      --r: 24px;
      --btn: #0f172a;
      --btn-hover: #1e293b;
      --accent1: #ff4d8d;
      --accent2: #7c3aed;
      --accent3: #06b6d4;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
      margin: 0;
    }

    body {
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial;
      color: var(--ink);
      background:
        radial-gradient(1200px 700px at 10% 0%, var(--bg1), transparent 55%),
        radial-gradient(1000px 700px at 90% 10%, var(--bg2), transparent 60%),
        radial-gradient(900px 700px at 50% 100%, var(--bg3), transparent 55%),
        linear-gradient(180deg, #ffffff, #f8fafc);
      overflow-x: hidden;
      padding: 20px;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
    }

    h1 {
      margin: 0;
      font-size: 28px;
      background: linear-gradient(90deg, var(--accent1), var(--accent2));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .card {
      background: var(--card);
      backdrop-filter: blur(10px);
      border-radius: var(--r);
      box-shadow: var(--shadow);
      border: 1px solid rgba(255, 255, 255, .7);
      padding: 24px;
      margin-bottom: 24px;
    }

    .btn {
      padding: 10px 20px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .btn-primary {
      background: var(--btn);
      color: white;
    }

    .btn-primary:hover {
      background: var(--btn-hover);
      transform: translateY(-1px);
    }

    .btn-secondary {
      background: rgba(15, 23, 42, 0.05);
      color: var(--ink);
    }

    .btn-secondary:hover {
      background: rgba(15, 23, 42, 0.1);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }

    th {
      text-align: left;
      padding: 12px;
      border-bottom: 2px solid rgba(15, 23, 42, 0.05);
      color: var(--muted);
      font-size: 14px;
    }

    td {
      padding: 12px;
      border-bottom: 1px solid rgba(15, 23, 42, 0.05);
      font-size: 15px;
    }

    .status-pill {
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
    }

    .status-active {
      background: #dcfce7;
      color: #166534;
    }

    .status-inactive {
      background: #fee2e2;
      color: #991b1b;
    }

    .actions {
      display: flex;
      gap: 8px;
    }

    /* Modal Styles */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.4);
      backdrop-filter: blur(4px);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }

    .modal-content {
      background: white;
      padding: 30px;
      border-radius: var(--r);
      width: 100%;
      max-width: 500px;
      box-shadow: var(--shadow);
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 500;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid rgba(15, 23, 42, 0.1);
      outline: none;
    }

    input:focus {
      border-color: var(--accent2);
      box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.1);
    }

    .loader {
      display: none;
      text-align: center;
      padding: 40px;
    }

    .loading-spinner {
      width: 40px;
      height: 40px;
      border: 4px solid rgba(0, 0, 0, 0.1);
      border-top: 4px solid var(--accent2);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 10px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      padding: 12px 24px;
      background: var(--ink);
      color: white;
      border-radius: 12px;
      transform: translateY(100px);
      transition: transform 0.3s cubic-bezier(0.18, 0.89, 0.32, 1.28);
      z-index: 1000;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
    }

    .toast.show {
      transform: translateY(0);
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="header">
      <h1>EventSnap Admin</h1>
      <div style="display:flex; gap:10px; align-items:center;">
        <input type="text" id="adminScriptUrl" placeholder="URL del Script (exec...)"
          style="width:280px; font-size:12px; padding:10px; border-radius:10px; border:1px solid #ddd;" />
        <button class="btn btn-secondary" onclick="testConnection()" title="Probar conexión en nueva pestaña">
          <span>🔍</span>
        </button>
        <button class="btn btn-primary" onclick="openModal()">
          <span>+</span> Nuevo Evento
        </button>
      </div>
    </div>

    <div class="card">
      <div id="loader" class="loader">
        <div class="loading-spinner"></div>
        <p>Cargando eventos...</p>
      </div>
      <div id="tableContainer">
        <table id="eventsTable">
          <thead>
            <tr>
              <th>Nombre</th>
              <th>Clave (SLUG)</th>
              <th>Estado</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="eventsList">
            <!-- Items filled by JS -->
          </tbody>
        </table>
      </div>
    </div>

    <!-- Generador de Códigos Cortos Proyector -->
    <div class="card">
      <h2>🎥 Generador de Código Corto</h2>
      <p style="color:var(--muted); font-size:14px; margin-bottom:16px;">Genera un código corto (ej: ABC123) fácil de
        escribir en la TV.</p>

      <div style="display:grid; grid-template-columns: 1fr 1fr; gap:16px; margin-bottom:16px;">
        <div class="form-group">
          <label>ID de Carpeta (Drive)</label>
          <input type="text" id="sc_folderId" placeholder="Ej: 1A2b3C..." />
        </div>
        <div class="form-group">
          <label>Nombre/Descripción (Opcional)</label>
          <input type="text" id="sc_nombre" placeholder="Ej: Boda Laura" />
        </div>
      </div>

      <div class="form-group">
        <label>Código Generado</label>
        <div style="display:flex; gap:8px;">
          <input type="text" id="sc_codigo" readonly
            style="background: rgba(0,0,0,0.03); font-size:20px; font-weight:bold; letter-spacing:2px; text-align:center;"
            placeholder="------" />
          <button class="btn btn-primary" onclick="generateShortCode()">Generar Código</button>
          <button class="btn btn-secondary" onclick="copyShortCodeLink()">Copiar Link</button>
        </div>
        <small id="sc_fullUrl" style="color:var(--muted); margin-top:8px; display:block;"></small>
      </div>
    </div>

    <!-- Tabla de Códigos Generados -->
    <div class="card">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
        <h2 style="margin:0;">📋 Códigos Generados</h2>
        <button class="btn btn-secondary" onclick="loadShortCodes()">🔄 Actualizar</button>
      </div>

      <div id="codesTableContainer">
        <table id="codesTable">
          <thead>
            <tr>
              <th>Código</th>
              <th>Carpeta</th>
              <th>Nombre</th>
              <th>Estado</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="codesList">
            <!-- Filled by JS -->
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Modal -->
  <div id="eventModal" class="modal">
    <div class="modal-content">
      <h2 id="modalTitle">Nuevo Evento</h2>
      <form id="eventForm" onsubmit="handleSave(event)">
        <input type="hidden" id="oldKey" />
        <div class="form-group">
          <label>Nombre del Evento</label>
          <input type="text" id="nombre" placeholder="Ej: Boda de Laura y Marc" required
            oninput="suggestKey(this.value)" />
        </div>
        <div class="form-group">
          <label>Clave del Evento (slug)</label>
          <input type="text" id="eventKey" placeholder="ej: laura-y-marc" required />
        </div>
        <div class="form-group">
          <label>ID Carpeta Google Drive</label>
          <div style="display:flex; gap:8px;">
            <input type="text" id="folderId" placeholder="ID de la carpeta" required />
            <button type="button" class="btn btn-secondary" onclick="generateFolder()" id="genBtn"
              style="white-space:nowrap;">Crear Carpeta</button>
          </div>
        </div>
        <div class="form-group">
          <label>
            <input type="checkbox" id="activo" checked style="width:auto; margin-right:8px;"> Evento Activo
          </label>
        </div>
        <div style="display:flex; justify-content:flex-end; gap:10px; margin-top:24px;">
          <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancelar</button>
          <button type="submit" class="btn btn-primary" id="saveBtn">Guardar Evento</button>
        </div>
      </form>
    </div>
  </div>

  <div id="toast" class="toast">¡Operación completada!</div>

  <script>
    let events = [];

    // Sanitize localStorage - remove any corrupted values
    function getStorageValue(key) {
      const val = localStorage.getItem(key);
      if (!val || val === 'undefined' || val === 'null' || val === '') {
        localStorage.removeItem(key);
        return '';
      }
      return val;
    }

    let ADMIN_SCRIPT_URL = getStorageValue('es_projector_url');
    let ADMIN_AUTH = getStorageValue('es_admin_auth');

    // UI Refs
    const urlInput = document.getElementById('adminScriptUrl');

    // Init inputs
    urlInput.value = ADMIN_SCRIPT_URL;

    urlInput.onchange = (e) => {
      ADMIN_SCRIPT_URL = e.target.value.trim();
      if (ADMIN_SCRIPT_URL) {
        localStorage.setItem('es_projector_url', ADMIN_SCRIPT_URL);
      } else {
        localStorage.removeItem('es_projector_url');
      }
      checkAuthAndLoad();
    };

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 3000);
    }

    // Add logout button capability next to the script url input (implied UI change later or simplified here)
    // For now, promptForAuth will handle missing auth

    function init() {
      if (!ADMIN_SCRIPT_URL) {
        document.getElementById('eventsList').innerHTML = '<tr><td colspan="4" style="text-align:center; padding:40px;">Por favor, introduce la URL de tu Script arriba para ver los eventos.</td></tr>';
        document.getElementById('loader').style.display = 'none';
        document.getElementById('tableContainer').style.display = 'block';
        return;
      }
      loadEvents();
    }

    function testConnection() {
      if (!ADMIN_SCRIPT_URL) return alert("Pega primero la URL");

      let pass = ADMIN_AUTH;
      if (!pass || pass === 'undefined' || pass === 'null') {
        pass = prompt("🔑 Para probar la conexión, confirma tu contraseña:");
        if (pass) {
          ADMIN_AUTH = pass;
          localStorage.setItem('es_admin_auth', ADMIN_AUTH);
        } else {
          return;
        }
      }

      const safePass = encodeURIComponent(pass);
      window.open(ADMIN_SCRIPT_URL + "?action=getAllEvents&auth=" + safePass, "_blank");
    }

    async function apiCall(action, data = null) {
      if (!ADMIN_SCRIPT_URL) throw new Error("No URL configured");

      // Safety check for auth
      if (!ADMIN_AUTH || ADMIN_AUTH === 'undefined' || ADMIN_AUTH === 'null') {
        throw new Error("Contraseña no configurada. Recarga la página.");
      }

      let url = ADMIN_SCRIPT_URL;

      // POST request
      if (data) {
        const payload = { action, data, ...data };
        const resp = await fetch(url, {
          method: 'POST',
          redirect: 'follow',
          body: JSON.stringify(payload)
        });

        const text = await resp.text();
        try {
          return JSON.parse(text);
        } catch (e) {
          console.error("API Response (Not JSON):", text);
          throw new Error("La respuesta del servidor no es JSON válido. Revisa la consola.");
        }
      }
      // GET request
      else {
        const resp = await fetch(`${url}?action=${action}`);
        const text = await resp.text();
        try {
          return JSON.parse(text);
        } catch (e) {
          console.error("API Response (Not JSON):", text);
          throw new Error("El script devolvió HTML en lugar de JSON. ¿Has creado una 'Nueva Versión' después de cambiar el código?");
        }
      }
    }

    async function loadEvents() {
      document.getElementById('loader').style.display = 'block';
      document.getElementById('tableContainer').style.display = 'none';

      try {
        const res = await apiCall('getAllEvents');
        if (res.success) {
          events = res.data;
          renderEvents();
          // Add a small logout link/indicator if successful
          const header = document.querySelector('.header h1');
          if (header && !document.getElementById('logoutBtn')) {
            const btn = document.createElement('span');
            btn.id = 'logoutBtn';
            btn.innerHTML = ' <small style="font-size:12px; cursor:pointer; opacity:0.6" onclick="logout()">[Salir]</small>';
            header.appendChild(btn);
          }
        } else {
          // If error is auth related, clear auth
          if (res.error && res.error.includes("contraseña")) {
            localStorage.removeItem('es_admin_auth');
            ADMIN_AUTH = '';
            // Retry once or show error
            if (confirm("Contraseña incorrecta. ¿Intentar de nuevo?")) {
              checkAuthAndLoad();
              return;
            }
          }
          document.getElementById('eventsList').innerHTML = `<tr><td colspan="4" style="text-align:center; color:red;">Error API: ${res.error}</td></tr>`;
        }
      } catch (err) {
        console.error(err);
        let msg = "Error de conexión";
        if (err.message.includes("JSON")) msg = "El script devolvió HTML (código viejo). Crea una Nueva Versión en Apps Script.";

        document.getElementById('eventsList').innerHTML = `<tr><td colspan="4" style="text-align:center; color:red;">${msg} <br><small>${err.message}</small></td></tr>`;
      } finally {
        document.getElementById('loader').style.display = 'none';
        document.getElementById('tableContainer').style.display = 'block';
      }
    }

    function renderEvents() {
      const list = document.getElementById('eventsList');
      list.innerHTML = '';
      if (events.length === 0) {
        list.innerHTML = '<tr><td colspan="4" style="text-align:center;">No hay eventos encontrados.</td></tr>';
        return;
      }
      events.forEach(ev => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td><strong>${ev.nombre}</strong></td>
          <td><code>${ev.eventKey}</code></td>
          <td>
            <span class="status-pill ${ev.activo ? 'status-active' : 'status-inactive'}">
              ${ev.activo ? 'ACTIVO' : 'INACTIVO'}
            </span>
          </td>
          <td class="actions">
            <button class="btn btn-secondary" onclick="editEvent('${ev.eventKey}')">Editar</button>
            <button class="btn btn-secondary" onclick="copyLink('${ev.eventKey}')">Link</button>
            <button class="btn btn-secondary" onclick="confirmDelete('${ev.eventKey}')" style="color:#ef4444;">Eliminar</button>
          </td>
        `;
        list.appendChild(tr);
      });
    }

    function suggestKey(val) {
      if (document.getElementById('oldKey').value) return;
      const slug = val.toLowerCase()
        .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
        .replace(/[^a-z0-9]/g, '-')
        .replace(/-+/g, '-')
        .replace(/^-|-$/g, '');
      document.getElementById('eventKey').value = slug;
    }

    function openModal(editData = null) {
      document.getElementById('eventModal').style.display = 'flex';
      if (editData) {
        document.getElementById('modalTitle').textContent = 'Editar Evento';
        document.getElementById('oldKey').value = editData.eventKey;
        document.getElementById('nombre').value = editData.nombre;
        document.getElementById('eventKey').value = editData.eventKey;
        document.getElementById('folderId').value = editData.folderId;
        document.getElementById('activo').checked = editData.activo;
      } else {
        document.getElementById('modalTitle').textContent = 'Nuevo Evento';
        document.getElementById('eventForm').reset();
        document.getElementById('oldKey').value = '';
      }
    }

    function closeModal() { document.getElementById('eventModal').style.display = 'none'; }

    async function handleSave(e) {
      e.preventDefault();
      const saveBtn = document.getElementById('saveBtn');
      saveBtn.disabled = true;
      saveBtn.textContent = 'Guardando...';

      const payload = {
        oldKey: document.getElementById('oldKey').value,
        nombre: document.getElementById('nombre').value,
        eventKey: document.getElementById('eventKey').value,
        folderId: document.getElementById('folderId').value,
        activo: document.getElementById('activo').checked
      };

      try {
        // Nota: doPost en Apps Script con CORS a veces es caprichoso. 
        // Si esto falla, podrías habilitar acciones por GET como fallback.
        const res = await apiCall('saveEvent', payload);
        if (res && res.success) {
          showToast('¡Evento Guardado!');
          closeModal();
          loadEvents();
        } else { alert('Error: ' + (res?.error || 'Falló el guardado')); }
      } catch (err) { alert('Error de conexión o CORS. Revisa que el Script esté desplegado correctamente.'); }
      finally { saveBtn.disabled = false; saveBtn.textContent = 'Guardar Evento'; }
    }

    function editEvent(key) { const ev = events.find(e => e.eventKey === key); if (ev) openModal(ev); }

    async function confirmDelete(key) {
      if (confirm(`¿Eliminar evento ${key}?`)) {
        try {
          const res = await apiCall('deleteEvent', { eventKey: key });
          if (res && res.success) { showToast('Eliminado'); loadEvents(); }
          else { alert('Error al eliminar'); }
        } catch (err) { alert('Error de conexión'); }
      }
    }

    function copyLink(key) {
      const origin = window.location.origin;
      const standardUrl = `${origin}/e/${key}`;
      const sportsUrl = `${origin}/s/${key}`;

      // Mostrar ambas opciones o copiar la estándar por defecto
      const choice = prompt(
        `Enlaces para "${key}":\n\n1. Estándar (Bodas/Eventos): ${standardUrl}\n2. Deportes/Gym: ${sportsUrl}\n\nCopia el que necesites:`,
        standardUrl
      );
    }

    async function generateFolder() {
      const name = document.getElementById('nombre').value;
      if (!name) return alert('Pon un nombre primero');
      const genBtn = document.getElementById('genBtn');
      genBtn.disabled = true;
      genBtn.textContent = 'Creando...';
      try {
        const res = await apiCall('createDriveFolder', { name });
        if (res && res.success && res.ok) {
          document.getElementById('folderId').value = res.folderId;
          showToast('Carpeta Creada!');
        } else { alert('Error al crear carpeta'); }
      } catch (err) { alert('Error de conexión'); }
      finally { genBtn.disabled = false; genBtn.textContent = 'Crear Carpeta'; }
    }


    // ===== SHORT CODE SYSTEM FUNCTIONS =====

    let shortCodes = [];

    async function generateShortCode() {
      const folderId = document.getElementById('sc_folderId').value.trim();
      if (!folderId) return alert('Introduce el ID de la carpeta primero');

      const nombre = document.getElementById('sc_nombre').value.trim();
      const scriptUrl = ADMIN_SCRIPT_URL;

      try {
        const res = await apiCall('createShortCode', { folderId, scriptUrl, nombre });
        if (res && res.ok) {
          const codigo = res.codigo;
          document.getElementById('sc_codigo').value = codigo;

          const origin = window.location.origin;
          const shortUrl = `${origin}/p?c=${codigo}`;
          document.getElementById('sc_fullUrl').textContent = `Link: ${shortUrl}`;

          showToast('¡Código generado!');
          loadShortCodes(); // Reload table

          // Clear inputs
          document.getElementById('sc_folderId').value = '';
          document.getElementById('sc_nombre').value = '';
        } else {
          alert('Error: ' + (res?.error || 'No se pudo generar el código'));
        }
      } catch (err) {
        alert('Error de conexión');
        console.error(err);
      }
    }

    function copyShortCodeLink() {
      const codigo = document.getElementById('sc_codigo').value;
      if (!codigo || codigo === '------') {
        return alert('Genera un código primero');
      }

      const origin = window.location.origin;
      const shortUrl = `${origin}/p?c=${codigo}`;

      // Copy to clipboard
      navigator.clipboard.writeText(shortUrl).then(() => {
        showToast('¡Link copiado!');
      }).catch(() => {
        // Fallback for older browsers
        const dummy = document.createElement('textarea');
        dummy.value = shortUrl;
        document.body.appendChild(dummy);
        dummy.select();
        document.execCommand('copy');
        document.body.removeChild(dummy);
        showToast('¡Link copiado!');
      });
    }

    async function loadShortCodes() {
      try {
        const res = await apiCall('getAllShortCodes');
        if (res && res.success) {
          shortCodes = res.data || [];
          renderShortCodes();
        } else {
          console.warn('Error loading short codes:', res?.error);
        }
      } catch (err) {
        console.error('Error loading short codes:', err);
      }
    }

    function renderShortCodes() {
      const list = document.getElementById('codesList');
      list.innerHTML = '';

      if (shortCodes.length === 0) {
        list.innerHTML = '<tr><td colspan="5" style="text-align:center; padding:40px; color:var(--muted);">No hay códigos generados aún.</td></tr>';
        return;
      }

      shortCodes.forEach(code => {
        const tr = document.createElement('tr');
        const origin = window.location.origin;
        const shortUrl = `${origin}/p?c=${code.codigo}`;

        // Truncate folder ID for display
        const folderDisplay = code.folderId.length > 15
          ? code.folderId.substring(0, 15) + '...'
          : code.folderId;

        tr.innerHTML = `
          <td><strong style="font-family:monospace; font-size:16px; letter-spacing:1px;">${code.codigo}</strong></td>
          <td><small title="${code.folderId}">${folderDisplay}</small></td>
          <td>${code.nombre || '<em style="color:#aaa;">Sin nombre</em>'}</td>
          <td>
            <label style="display:inline-flex; align-items:center; cursor:pointer;">
              <input type="checkbox" ${code.activo ? 'checked' : ''} 
                     onchange="toggleCodeStatus('${code.codigo}', this.checked)"
                     style="margin-right:6px; cursor:pointer;">
              <span class="status-pill ${code.activo ? 'status-active' : 'status-inactive'}">
                ${code.activo ? 'ACTIVO' : 'INACTIVO'}
              </span>
            </label>
          </td>
          <td class="actions">
            <button class="btn btn-secondary" onclick="copyCodeLink('${code.codigo}')" title="Copiar link">📋</button>
            <button class="btn btn-secondary" onclick="confirmDeleteCode('${code.codigo}')" style="color:#ef4444;" title="Eliminar">🗑️</button>
          </td>
        `;
        list.appendChild(tr);
      });
    }

    async function toggleCodeStatus(codigo, activo) {
      try {
        const res = await apiCall('toggleShortCode', { codigo, activo });
        if (res && res.ok) {
          showToast(activo ? 'Código activado' : 'Código desactivado');
          loadShortCodes();
        } else {
          alert('Error al cambiar estado');
          loadShortCodes(); // Reload to reset checkbox
        }
      } catch (err) {
        alert('Error de conexión');
        loadShortCodes();
      }
    }

    function copyCodeLink(codigo) {
      const origin = window.location.origin;
      const shortUrl = `${origin}/p?c=${codigo}`;

      navigator.clipboard.writeText(shortUrl).then(() => {
        showToast('¡Link copiado!');
      }).catch(() => {
        const dummy = document.createElement('textarea');
        dummy.value = shortUrl;
        document.body.appendChild(dummy);
        dummy.select();
        document.execCommand('copy');
        document.body.removeChild(dummy);
        showToast('¡Link copiado!');
      });
    }

    async function confirmDeleteCode(codigo) {
      if (!confirm(`¿Eliminar el código ${codigo}? Esta acción no se puede deshacer.`)) {
        return;
      }

      try {
        const res = await apiCall('deleteShortCode', { codigo });
        if (res && res.ok) {
          showToast('Código eliminado');
          loadShortCodes();
        } else {
          alert('Error al eliminar');
        }
      } catch (err) {
        alert('Error de conexión');
      }
    }

    function init() {
      if (!ADMIN_SCRIPT_URL) {
        document.getElementById('eventsList').innerHTML = '<tr><td colspan="4" style="text-align:center; padding:40px;">Por favor, introduce la URL de tu Script arriba para ver los eventos.</td></tr>';
        document.getElementById('loader').style.display = 'none';
        document.getElementById('tableContainer').style.display = 'block';
        return;
      }
      loadEvents();
      loadShortCodes(); // Load short codes table
    }

    window.onload = init;
  </script>

</html>
