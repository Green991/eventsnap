<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1, viewport-fit=cover" />
    <title>EventSnap SPORTS</title>
    <style>
        :root {
            /* Dark/Aggressive Theme Palette */
            --bg-dark: #0a0a0a;
            --bg-card: rgba(20, 20, 20, 0.95);
            --neon-blue: #00f3ff;
            --neon-pink: #ff0055;
            --text-main: #ffffff;
            --text-muted: #a3a3a3;

            --r: 4px;
            /* Sharp corners */
            --btn-primary: #ffffff;
            --btn-primary-text: #000000;

            --shadow-neon: 0 0 20px rgba(0, 243, 255, 0.15);
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
        }

        body {
            margin: 0;
            font-family: 'Teko', 'Oswald', ui-sans-serif, system-ui, sans-serif;
            /* Aggressive font stack */
            color: var(--text-main);
            background-color: var(--bg-dark);
            background-image:
                linear-gradient(45deg, #111 25%, transparent 25%, transparent 75%, #111 75%, #111),
                linear-gradient(45deg, #111 25%, transparent 25%, transparent 75%, #111 75%, #111);
            background-size: 20px 20px;
            background-position: 0 0, 10px 10px;
            overflow-x: hidden;
            text-transform: uppercase;
            /* Aggressive text style */
            letter-spacing: 1px;
        }

        /* Dynamic background element */
        .glow-bg {
            position: fixed;
            top: 50%;
            left: 50%;
            width: 150vw;
            height: 150vw;
            transform: translate(-50%, -50%);
            background: radial-gradient(circle, rgba(0, 243, 255, 0.08) 0%, rgba(255, 0, 85, 0.05) 50%, transparent 70%);
            pointer-events: none;
            z-index: -1;
            animation: pulse 4s ease-in-out infinite alternate;
        }

        @keyframes pulse {
            0% {
                opacity: 0.5;
                transform: translate(-50%, -50%) scale(1);
            }

            100% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1.1);
            }
        }

        .wrap {
            max-width: 640px;
            margin: 0 auto;
            padding: 18px 16px 34px;
            min-height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card {
            width: 100%;
            border-radius: var(--r);
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.8), inset 0 0 1px rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.1);
            overflow: hidden;
            position: relative;
        }

        /* Neon border effect on top */
        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, var(--neon-pink), var(--neon-blue));
            z-index: 10;
        }

        .header {
            padding: 24px 20px 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
        }

        .pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 4px 12px;
            border: 1px solid var(--neon-blue);
            color: var(--neon-blue);
            font-weight: 700;
            font-size: 14px;
            letter-spacing: 2px;
            margin-bottom: 12px;
            background: rgba(0, 243, 255, 0.05);
        }

        h1 {
            margin: 12px 0 8px;
            font-size: clamp(28px, 6vw, 42px);
            line-height: 1;
            font-weight: 900;
            font-style: italic;
            text-shadow: 2px 2px 0px rgba(255, 0, 85, 0.5);
        }

        .sub {
            margin: 0;
            color: var(--text-muted);
            line-height: 1.4;
            font-size: 14px;
            letter-spacing: 0.5px;
            text-transform: none;
            /* Keep instructions readable */
        }

        .sub b {
            color: var(--neon-pink);
        }

        .content {
            padding: 24px 20px;
        }

        .grid {
            display: grid;
            gap: 16px;
            margin-top: 14px;
        }

        .btn {
            width: 100%;
            border: 0;
            padding: 18px 16px;
            border-radius: 0;
            /* Square buttons */
            cursor: pointer;
            font-weight: 900;
            font-size: 20px;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            transition: all .2s ease;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
            /* Sci-fi/Tech shape */
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn.primary {
            background: var(--btn-primary);
            color: var(--btn-primary-text);
            /* Glitch effect on hover could go here */
        }

        .btn.primary:hover {
            background: var(--neon-blue);
            box-shadow: 0 0 20px var(--neon-blue);
        }

        .btn.secondary {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-main);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .btn.secondary:hover {
            border-color: var(--neon-pink);
            color: var(--neon-pink);
            box-shadow: inset 0 0 10px rgba(255, 0, 85, 0.2);
        }

        .btn.disabled {
            opacity: .5;
            cursor: not-allowed;
            filter: grayscale(1);
        }

        .icon {
            font-size: 24px;
            line-height: 1;
        }

        .previewWrap {
            margin-top: 16px;
            border: 1px solid var(--neon-blue);
            background: #000;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.2);
        }

        img {
            width: 100%;
            display: block;
            max-height: 60vh;
            object-fit: cover;
            filter: contrast(1.1);
        }

        .status {
            margin-top: 16px;
            min-height: 24px;
            font-size: 15px;
            color: var(--text-muted);
            text-align: center;
            text-transform: none;
        }

        .statusPill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            font-weight: bold;
            letter-spacing: 0.5px;
            background: #111;
            border: 1px solid #333;
        }

        .ok {
            border-color: var(--neon-blue);
            color: var(--neon-blue);
            box-shadow: 0 0 10px rgba(0, 243, 255, 0.2);
        }

        .bad {
            border-color: var(--neon-pink);
            color: var(--neon-pink);
            box-shadow: 0 0 10px rgba(255, 0, 85, 0.2);
        }

        .warn {
            border-color: #ffd700;
            color: #ffd700;
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.2);
        }

        .small {
            margin-top: 16px;
            font-size: 12px;
            color: #666;
            line-height: 1.4;
            text-align: center;
            text-transform: none;
        }

        .footer {
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(0, 0, 0, 0.3);
        }

        .mini {
            font-size: 11px;
            color: #555;
            letter-spacing: 1px;
        }

        .spark {
            color: var(--neon-blue);
            font-weight: bold;
        }

        .hidden {
            display: none !important;
        }

        .inputName {
            width: 100%;
            padding: 16px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.2);
            font-size: 18px;
            color: white;
            outline: none;
            transition: all .2s ease;
            font-family: inherit;
            text-transform: uppercase;
            text-align: center;
            letter-spacing: 1px;
        }

        .inputName::placeholder {
            color: #555;
            text-transform: none;
        }

        .inputName:focus {
            border-color: var(--neon-blue);
            background: rgba(0, 243, 255, 0.05);
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.1);
        }

        /* Recorder Modal (Dark) */
        .recorderModal {
            position: fixed;
            inset: 0;
            background: #000;
            z-index: 10000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .recorderVideo {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .recorderControls {
            position: absolute;
            bottom: 40px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 24px;
            padding: 20px;
        }

        .recBtn {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.3);
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all .2s;
        }

        .recBtnInner {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: var(--neon-pink);
            box-shadow: 0 0 20px var(--neon-pink);
            transition: all .2s;
        }

        .recBtn.recording .recBtnInner {
            width: 30px;
            height: 30px;
            border-radius: 4px;
            background: #fff;
            box-shadow: 0 0 10px #fff;
        }

        .cancelBtn {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #fff;
            background: rgba(0, 0, 0, 0.8);
            padding: 10px 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            font-size: 14px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .timer {
            position: absolute;
            top: 20px;
            right: 20px;
            color: var(--neon-pink);
            text-shadow: 0 0 10px var(--neon-pink);
            font-weight: 900;
            font-family: monospace;
            font-size: 24px;
            letter-spacing: 2px;
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Teko:wght@400;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="glow-bg"></div>
    <div class="wrap">
        <div class="card">
            <div class="header">
                <div class="pill">⚡ TEAM <span id="couplePill">EventSnap</span></div>
                <h1>MOMENTOS ÉPICOS</h1>
                <p class="sub" id="subtitle">
                    Captura el <b>ESFUERZO</b>, la <b>GLORIA</b> y la <b>FIESTA</b>.<br>
                    Se guardará en el álbum privado de <b><span id="coupleName">—</span></b> 💪
                </p>
            </div>

            <div class="content">
                <div id="invalidBlock" class="hidden">
                    <button class="btn secondary disabled" disabled
                        style="border-color:var(--neon-pink); color:var(--neon-pink);">
                        <span>🚫</span> LINK INVÁLIDO
                    </button>
                    <div class="status">
                        <span class="statusPill bad" id="invalidMsg">Código QR incorrecto</span>
                    </div>
                </div>

                <div id="validBlock" class="hidden">
                    <div class="grid">
                        <div style="margin-bottom:6px">
                            <input type="text" id="uploaderName" placeholder="TU NOMBRE / DORSAL" class="inputName" />
                        </div>

                        <button class="btn primary" id="takeBtn"><span>📸</span> FOTO RÁPIDA</button>
                        <button class="btn secondary" id="videoBtn"><span>🎥</span> GRABAR (10s)</button>

                        <input class="hidden" id="cameraInput" type="file" accept="image/*" capture="environment" />
                        <input class="hidden" id="videoInput" type="file" accept="video/*" capture="environment" />

                        <div id="previewWrap" class="previewWrap hidden">
                            <img id="preview" alt="Previsualización" />
                            <video id="videoPreview" controls
                                style="width:100%; max-height:56vh; display:none;"></video>
                        </div>

                        <button class="btn primary hidden" id="sendBtn"
                            style="background:var(--neon-blue); color:#000;">
                            <span>🚀</span> ENVIAR AHORA
                        </button>
                    </div>

                    <div class="status" id="status"></div>

                    <div class="small">
                        Dale duro aunque haya poca cobertura.<br>
                        <span class="spark">NO PAIN NO GLORY</span> 🔥
                    </div>
                </div>

                <div id="loadingBlock">
                    <button class="btn secondary disabled" disabled>
                        <span>⏳</span> CARGANDO EVENTO...
                    </button>
                </div>
            </div>

            <div class="footer">
                <div class="mini">POWERED BY <span id="footerCouple">EventSnap</span></div>
                <div class="mini">🦾 VIBE ON</div>
            </div>
        </div>
    </div>

    <div id="recorderModal" class="recorderModal hidden">
        <video id="recorderLive" class="recorderVideo" autoplay playsinline muted></video>
        <button id="recCancelBtn" class="cancelBtn">CANCELAR</button>
        <div id="recTimer" class="timer hidden">00:00</div>
        <div class="recorderControls">
            <button id="recActionBtn" class="recBtn">
                <div class="recBtnInner"></div>
            </button>
        </div>
    </div>

    <script>
        // --- EXACT SAME LOGIC AS INDEX.HTML ---
        (function () {
            const API_URL = "https://eventsnap-proxy.eventsnap-contacto.workers.dev/";

            // Extrae eventKey desde /s/<key> (o /e/ si quieres compatibilidad)
            function getEventKeyFromPath() {
                const p = (location.pathname || "").replace(/\/+$/, "");
                // Ahora busca /s/ al principio, o fallback a /e/ si fuera necesario
                const m = p.match(/^\/(?:s|e)\/([^\/?#]+)$/i);
                return m ? decodeURIComponent(m[1]) : "";
            }

            const EVENT_KEY = getEventKeyFromPath();

            const loadingBlock = document.getElementById("loadingBlock");
            const invalidBlock = document.getElementById("invalidBlock");
            const validBlock = document.getElementById("validBlock");
            const couplePill = document.getElementById("couplePill");
            const coupleName = document.getElementById("coupleName");
            const footerCouple = document.getElementById("footerCouple");
            const invalidMsg = document.getElementById("invalidMsg");

            const takeBtn = document.getElementById("takeBtn");
            const videoBtn = document.getElementById("videoBtn");
            const cameraInput = document.getElementById("cameraInput");
            const videoInput = document.getElementById("videoInput");
            const previewWrap = document.getElementById("previewWrap");
            const preview = document.getElementById("preview");
            const videoPreview = document.getElementById("videoPreview");
            const sendBtn = document.getElementById("sendBtn");
            const statusEl = document.getElementById("status");
            const nameInput = document.getElementById("uploaderName");

            const recorderModal = document.getElementById("recorderModal");
            const recorderLive = document.getElementById("recorderLive");
            const recCancelBtn = document.getElementById("recCancelBtn");
            const recActionBtn = document.getElementById("recActionBtn");
            const recTimer = document.getElementById("recTimer");

            let mediaRecorder = null;
            let recordedChunks = [];
            let stream = null;
            let timerInterval = null;
            let isRecording = false;
            let dataUrlToSend = null;
            let currentMimeType = "image/jpeg";

            function showInvalid(msg) {
                loadingBlock.classList.add("hidden");
                validBlock.classList.add("hidden");
                invalidBlock.classList.remove("hidden");
                if (msg) invalidMsg.textContent = msg;
            }
            function showValid(couple) {
                loadingBlock.classList.add("hidden");
                invalidBlock.classList.add("hidden");
                validBlock.classList.remove("hidden");
                couplePill.textContent = couple;
                coupleName.textContent = couple;
                // Keep footer as "EventSnap" - removed: footerCouple.textContent = couple;
                document.title = "EventSnap: " + couple;
            }

            function setStatus(text, kind) {
                if (!text) { statusEl.textContent = ""; return; }
                const cls = kind === "ok" ? "ok" : kind === "bad" ? "bad" : "warn";
                statusEl.innerHTML = `<span class="statusPill ${cls}">${escapeHtml(text)}</span>`;
            }
            function escapeHtml(s) {
                return String(s).replace(/[&<>"']/g, m => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;" }[m]));
            }

            async function apiCall(payload) {
                const res = await fetch(API_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });
                const txt = await res.text();
                try { return JSON.parse(txt); } catch { throw new Error("Server Error"); }
            }

            async function init() {
                if (!API_URL) return showInvalid("Falta API_URL");
                if (!EVENT_KEY) return showInvalid("Falta eventKey");
                try {
                    const info = await apiCall({ action: "info", eventKey: EVENT_KEY });
                    if (!info || !info.ok) return showInvalid(info?.error);
                    showValid(info.couple || EVENT_KEY);
                } catch (e) {
                    showInvalid("Error de conexión");
                }
            }

            takeBtn.onclick = () => cameraInput.click();
            videoBtn.onclick = () => startVideoRecorder();
            cameraInput.onchange = () => handleFile(cameraInput.files?.[0]);

            async function startVideoRecorder() {
                try {
                    stream = await navigator.mediaDevices.getUserMedia({
                        video: { facingMode: "environment", width: { ideal: 480 }, height: { ideal: 640 } },
                        audio: true
                    });
                    recorderLive.srcObject = stream;
                    recorderModal.classList.remove("hidden");
                    isRecording = false;
                    recActionBtn.classList.remove("recording");
                    recTimer.textContent = "00:00";
                } catch (err) { alert("Error cámara: " + err); }
            }

            function stopStream() {
                if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
                recorderModal.classList.add("hidden");
            }

            recCancelBtn.onclick = () => { if (isRecording) stopRecording(); stopStream(); };
            recActionBtn.onclick = () => { if (!isRecording) startRecording(); else stopRecording(); };

            function startRecording() {
                recordedChunks = [];
                const options = { mimeType: 'video/webm;codecs=vp8,opus', videoBitsPerSecond: 1500000 };
                try { mediaRecorder = new MediaRecorder(stream, options); }
                catch { mediaRecorder = new MediaRecorder(stream, { videoBitsPerSecond: 1500000 }); }

                mediaRecorder.ondataavailable = (event) => { if (event.data.size > 0) recordedChunks.push(event.data); };
                mediaRecorder.onstop = () => {
                    const blob = new Blob(recordedChunks, { type: "video/webm" });
                    handleFile(blob);
                    stopStream();
                };

                mediaRecorder.start();
                isRecording = true;
                recActionBtn.classList.add("recording");
                recTimer.classList.remove("hidden");

                let seconds = 0;
                timerInterval = setInterval(() => {
                    seconds++;
                    recTimer.textContent = `00:${seconds.toString().padStart(2, '0')}`;
                    if (seconds >= 10) stopRecording();
                }, 1000);
            }

            function stopRecording() {
                if (!mediaRecorder || mediaRecorder.state === "inactive") return;
                mediaRecorder.stop();
                isRecording = false;
                clearInterval(timerInterval);
                recActionBtn.classList.remove("recording");
            }

            async function handleFile(file) {
                if (!file) return;
                setStatus("PROCESANDO...", "warn");
                previewWrap.classList.remove("hidden");
                preview.classList.add("hidden");
                videoPreview.style.display = "none";

                if (file.type && file.type.startsWith("video/")) {
                    if (file.size > 25 * 1024 * 1024) return setStatus("❌ VÍDEO > 25MB", "bad");
                    currentMimeType = file.type || "video/webm";
                    videoPreview.src = URL.createObjectURL(file);
                    videoPreview.style.display = "block";
                    try {
                        dataUrlToSend = await blobToDataURL(file);
                        setStatus("VÍDEO LISTO ✅", "ok");
                        sendBtn.classList.remove("hidden");
                    } catch { setStatus("❌ ERROR LECTURA", "bad"); }
                } else {
                    currentMimeType = "image/jpeg";
                    preview.classList.remove("hidden");
                    preview.src = URL.createObjectURL(file);
                    try {
                        dataUrlToSend = await compressImageToJpeg(file, 1920, 0.92);
                        setStatus("FOTO LISTA ✅", "ok");
                        sendBtn.classList.remove("hidden");
                    } catch {
                        dataUrlToSend = await blobToDataURL(file);
                        setStatus("FOTO LISTA ✅", "ok");
                        sendBtn.classList.remove("hidden");
                    }
                }
            }

            const MAX_RETRIES = 2;
            const BASE_DELAY_MS = 1200;

            sendBtn.onclick = () => {
                if (!dataUrlToSend) return;
                sendBtn.disabled = true;
                setStatus("SUBIENDO... 🚀", "warn");
                tryUpload(0);
            };

            async function tryUpload(attempt) {
                try {
                    const res = await apiCall({
                        action: "upload", eventKey: EVENT_KEY, imageBase64: dataUrlToSend, mimeType: currentMimeType, uploaderName: (nameInput?.value || "").trim()
                    });
                    if (!res || !res.ok) return handleFailure(attempt);
                    setStatus("✅ ENVIADO. ¡GRANDE! 💪", "ok");
                    dataUrlToSend = null;
                    sendBtn.classList.add("hidden");
                    previewWrap.classList.add("hidden");
                    cameraInput.value = "";
                    videoInput.value = "";
                    sendBtn.disabled = false;
                } catch { handleFailure(attempt); }
            }

            function handleFailure(attempt) {
                if (attempt < MAX_RETRIES) {
                    const next = attempt + 1;
                    setStatus(`⚠️ REINTENTANDO (${next}/${MAX_RETRIES})...`, "warn");
                    setTimeout(() => tryUpload(next), BASE_DELAY_MS * next);
                } else {
                    setStatus("❌ ERROR DE SUBIDA. REVISA RED.", "bad");
                    sendBtn.disabled = false;
                }
            }

            function blobToDataURL(b) {
                return new Promise((r, j) => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.onerror = j; fr.readAsDataURL(b); });
            }
            function compressImageToJpeg(file, max, qual) {
                return new Promise((res, rej) => {
                    const img = new Image(); img.onload = () => {
                        let w = img.width, h = img.height; const m = Math.max(w, h);
                        if (m > max) { const s = max / m; w = Math.round(w * s); h = Math.round(h * s); }
                        const c = document.createElement("canvas"); c.width = w; c.height = h;
                        c.getContext("2d").drawImage(img, 0, 0, w, h);
                        c.toBlob(blob => { if (!blob) return rej(); res(blobToDataURL(blob)); }, "image/jpeg", qual);
                    };
                    img.src = URL.createObjectURL(file);
                });
            }

            init();
        })();
    </script>
</body>

</html>
